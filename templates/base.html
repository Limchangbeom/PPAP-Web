<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ project_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-{{ request.endpoint|default('app') }} {% block body_class %}{% endblock %}">
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">{{ project_name }}</span>
                <span class="brand-copy">{{ project_full_name }}</span>
            </a>
            <nav class="site-nav">
                <a href="{{ url_for('index') }}">메인</a>
                <a href="{{ url_for('diagnosis', page=1) }}">진단</a>
                <a href="{{ url_for('result') }}">결과</a>
            </nav>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="flash-stack" aria-label="알림 메시지">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
